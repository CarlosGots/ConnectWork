<div class="login-container">
  <div class="login-card anim-slide-up">

    <!-- Encabezado -->
    <div class="login-header">
      <h1>ConnectWork</h1>
      <p class="subtitulo">Plataforma de servicios freelance</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
      <h2>Iniciar sesión</h2>

      <div class="campo">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          placeholder="tu-usuario"
          autocomplete="username"
          required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          autocomplete="current-password"
          required>
      </div>

      <!-- Mensaje de error -->
      @if (mensajeError()) {
        <div class="mensaje-error">
          {{ mensajeError() }}
        </div>
      }

      <!-- Botón de envío -->
      <button type="submit" class="btn-primario" [disabled]="cargando()">
        @if (cargando()) {
          Iniciando sesión...
        } @else {
          Entrar
        }
      </button>
    </form>

    <!-- Link a registro -->
    <div class="login-footer">
      <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>

  </div>
</div>
